services:
  portfolio:
    build: .
    container_name: portfolio-tom
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 30073
    ports:
      - "30073:30073"
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:30073/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
